kind = "web"
previewPath = "/"
title = "Nazra-e-Awam"
description = "A static public-interest journalism website for submitting concerns by email, reading verified reports, and reviewing official responses and editorial policies."
version = "1.0.0"
id = "artifacts/nazra-e-awam"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19775

[services.development]
run = "pnpm --filter nazra-e-awam run dev"

[services.production]
build = [ "pnpm", "--filter", "nazra-e-awam", "run", "build" ]
serve = "static"
publicDir = "artifacts/nazra-e-awam/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19775"
BASE_PATH = "/"
