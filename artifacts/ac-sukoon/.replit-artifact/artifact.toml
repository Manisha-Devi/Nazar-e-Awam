kind = "web"
previewPath = "/"
title = "AC Sukoon"
description = "A React and Vite frontend starter using the requested Bootstrap, Chart.js, and Swiper stack, configured for static hosting."
version = "1.0.0"
id = "artifacts/ac-sukoon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24120

[services.development]
run = "pnpm --dir ../.. run dev"

[services.production]
build = [ "pnpm", "--dir", "../..", "run", "build" ]
serve = "static"
publicDir = "dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24120"
BASE_PATH = "/"
