kind = "web"
previewPath = "/"
title = "Nazar-e-Awam"
description = "A static public-interest journalism site for browsing verified reports and official responses, understanding editorial policies, and contacting the editors."
version = "1.0.0"
id = "artifacts/ac-sukoon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24120

[services.development]
run = "corepack npm --prefix ../.. run dev"

[services.production]
build = [ "corepack", "npm", "--prefix", "../..", "run", "build" ]
serve = "static"
publicDir = "dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24120"
BASE_PATH = "/"
